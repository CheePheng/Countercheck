[project]
name = "countercheck-pipeline"
version = "0.1.0"
description = "Synthetic invoices, purchase orders and deliveries for Countercheck, and its evals."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9",
  "reportlab>=4.2",
  "pdfplumber>=0.11",
]

[project.scripts]
countercheck-data = "countercheck_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercheck_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
